  <title>BD</title>
  <image href="/images/bd-symbol-rgb.png" x="0" y="0" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
  <text
    x="58"
    y="35"
    fill="#FFFFFF"
    font-family="Arial Black, Arial Rounded MT Bold, Arial, Helvetica, sans-serif"
    font-size="34"
    font-weight="900"
    letter-spacing="-1.2"
  >BD</text>
</svg>
