trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: "ubuntu-latest"

variables:
  STORAGE_ACCOUNT_NAME: "bdaidemo"

stages:
  - stage: BuildAndDeploy
    displayName: Build and Deploy React App

    jobs:
      - job: BuildAndDeployToStorage
        displayName: Build React App and Upload to Azure Storage

        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: "Use Node.js"
            inputs:
              versionSpec: "20.x"

          - script: |
              npm install
            displayName: "Install dependencies"

          - script: |
              npm run build
            displayName: "Build React App"

          - task: AzureCLI@2
            displayName: "Upload files to Storage Account"
            inputs:
              azureSubscription: "Radix-Downstream-POCs"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                az storage blob upload-batch \
                  --account-name $(STORAGE_ACCOUNT_NAME) \
                  --destination '$web' \
                  --source "dist" \
                  --overwrite