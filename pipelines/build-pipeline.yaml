trigger: none

pr:
  branches:
    include:
      - main
      - development

pool:
  vmImage: "ubuntu-latest"

variables:
  NODE_VERSION: "20.x"
  OUTPUT_LOCATION: "dist"

stages:
  - stage: Build
    displayName: Validate React App

    jobs:
      - job: BuildReact
        displayName: Build

        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0
            displayName: "Use Node.js $(NODE_VERSION)"
            inputs:
              versionSpec: "$(NODE_VERSION)"

          - script: |
              npm ci
            displayName: "Install dependencies"

          - script: |
              npm run build
            displayName: "Build React app"